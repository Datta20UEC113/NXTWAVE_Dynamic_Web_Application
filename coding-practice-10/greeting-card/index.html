<html>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>

  <style>@import url("https://fonts.googleapis.com/css2?family=Bree+Serif&family=Caveat:wght@400;700&family=Lobster&family=Monoton&family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display+SC:ital,wght@0,400;0,700;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+Pro:ital,wght@0,400;0,700;1,700&family=Work+Sans:ital,wght@0,400;0,700;1,700&display=swap");

.greeting-card-container {
  background-image: url("https://d2clawv67efefq.cloudfront.net/ccbp-dynamic-webapps/greeting-card-1-bg.png");
  background-size: cover;
  height: 100vh;
  padding: 20px;
}

.greet {
  color: #1f2933;
  font-family: "DM Sans";
  font-weight: bold;
}

.heading {
  color: #1f2933;
  font-family: "Playfair Display";
  font-size: 50px;
  font-weight: 500;
}

.new-year {
  font-size: 75px;
}

.greet-text-container {
  text-align: center;
  height: 80vh;
}

.greet-text {
  color: #323f4b;
  font-family: "Roboto";
  font-size: 24px;
}

</style></head>
  <body>
    <div class="greeting-card-container">
      <div class="text-right">
        <p class="greet"></p>
        <p class="greet"></p>
      </div>
      <div class="greet-text-container d-flex flex-column justify-content-center">
        <h1 class="heading">Happy <br/><span class="new-year">New Year</span></h1>
        <p class="greet-text mt-4"></p>
      </div>
    </div>
  <script>let greeting = '{"greetText":"Wishing that the new year will bring joy, love, peace, and happiness to you.","from":"Rahul","to":"Varakumar"}';

const card = JSON.parse(greeting);
const [sender, recipient] = document.querySelectorAll(".greet");
sender.textContent = "From: " + card.from;
recipient.textContent = "To: " + card.to;
document.querySelector(".greet-text").textContent = card.greetText;</script></body>
</html>
