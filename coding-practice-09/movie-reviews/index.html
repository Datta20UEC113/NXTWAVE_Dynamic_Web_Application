<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
  <style>body { font-family: Roboto, sans-serif; color: #2d3a35; } label { color: #7b8794; margin-top: 1rem; } article { border-top: 1px solid #cbd2d9; padding-top: 1rem; }</style></head>
  <body>
    <div class="container pt-4" id="movieReviewsContainer"><h1>Movie Reviews</h1><label for="titleInput">Movie title</label><input id="titleInput" class="form-control"><label for="reviewTextarea">Your review</label><textarea id="reviewTextarea" class="form-control"></textarea><button id="addBtn" class="btn btn-primary my-3">Add</button><div id="reviewsContainer"></div></div>
  <script>const title = document.getElementById("titleInput");
const review = document.getElementById("reviewTextarea");
document.getElementById("addBtn").onclick = () => {
  if (!title.value.trim()) { alert("Enter the movie title."); return; }
  const article = document.createElement("article");
  const heading = document.createElement("h2");
  const body = document.createElement("p");
  heading.textContent = title.value;
  body.textContent = review.value;
  article.append(heading, body);
  document.getElementById("reviewsContainer").appendChild(article);
  title.value = "";
  review.value = "";
};</script></body>
</html>
