<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
<style></style></head>

<body>
    <div id="orderedItemsContainer"><h1 class="hE mt-5">Your Ordered Items</h1><ul id="orderedItems" class="list-group mt-3"></ul></div>
<script>let itemList = [{
        itemName: "Veg Biryani",
        uniqueNo: 1
    },
    {
        itemName: "Chicken 65",
        uniqueNo: 2
    },
    {
        itemName: "Paratha",
        uniqueNo: 3
    }
];

const ulEle = document.getElementById("orderedItems");

// Function to create list item with delete button
function delItems(item) {
    let itemId = "item" + item.uniqueNo;

    // Create list item
    let liEle = document.createElement("li");
    liEle.id = itemId;
    liEle.classList.add("list-group-item", "d-flex", "justify-content-between", "align-items-center");
    liEle.textContent = item.itemName;

    // Create delete button
    let delBtn = document.createElement("button");
    delBtn.id = "button" + item.uniqueNo;
    delBtn.textContent = "Cancel";
    delBtn.classList.add("btn", "btn-danger", "btn-sm");

    // Delete functionality
    delBtn.onclick = function() {
        ulEle.removeChild(liEle);
    };

    // Add button to list item and list item to ul
    liEle.appendChild(delBtn);
    ulEle.appendChild(liEle);
}

// Render all items
for (let item of itemList) {
    delItems(item);
}</script></body>

</html>
